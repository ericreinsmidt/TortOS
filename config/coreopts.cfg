# Core options PlayOS applies to every game it launches.
#
# Diatom holds no per-core knowledge on purpose - its ADR-0019 makes the host
# own canonical->retropad translation as data, and its register section 12 says
# it keeps no core list. So the per-core opinions live here, in the launcher.
#
# Lines before any [SECTION] apply to every system. A [TAG] section applies to
# that system only, keyed on the same tag systems.cfg uses for saves and states.
# A core that does not declare a key ignores it, so a key meant for one core is
# harmless everywhere else.
#
# These are sent BEFORE the game loads. That matters: the options a core marks
# (Restart) are read during retro_load_game, so one set afterwards does nothing
# until the next launch.
#
# AND A RESUME STATE BEATS THEM. A save state carries the machine it was made
# on, so changing a (Restart) option that selects hardware will not appear to
# work on any game you have already played - the state restores the old machine
# and the option is overruled. This cost two false "still broken" readings on
# 2026-08-28: Mole Mania kept its Super Game Boy colors, and Dragon Warrior III,
# a Game Boy Color-only cartridge, showed its own "this game can only be played
# on Game Boy Color" screen. Both were correct settings losing to a stale state.
# Delete the game's .auto.state under .userdata/shared/.playos/ to test a change
# like this, or test on a game that has never been played.

# Super Game Boy borders, off everywhere. Authentic, and it costs 60% of the
# panel: the game renders 160x144 inside a 256x224 frame, so on a 1024x768
# screen it shrinks to about 640x494. Redundant now that Game Boy is pinned to
# DMG below, but it still catches any SGB title that lands in another folder.
mgba_sgb_borders=OFF

[GB]
# Autodetect boots a SUPER Game Boy for any cartridge with the SGB flag set -
# Mole Mania, Tetris, Pokemon Red - because those carry palette data for the
# SNES accessory. The result is a colourised, bordered picture in a list that
# says Game Boy, and a standard Game Boy has a monochrome screen.
#
# Pinned rather than left to Autodetect, and pinned HERE rather than globally:
# Autodetect is correct for Game Boy Color and GBA, and forcing DMG on a 0xC0
# cartridge like Dragon Warrior III would stop it booting at all.
mgba_gb_model=Game Boy

# Grayscale is the core's default and is not what the hardware looked like.
# DMG Green is the green-tinted LCD of an actual Game Boy.
mgba_gb_colors=DMG Green
