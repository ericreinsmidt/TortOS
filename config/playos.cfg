# PlayOS settings. This file is the whole settings screen -- there isn't one.
#
# volume        0..100, applied at boot. 40 lands on 8 of the codec's 20 steps.
# brightness    0..10, applied at boot and to the boot animation before it.
# startup_system  which shelf to open on, by display name. The launcher
#                 overrides this with wherever you were when you last played,
#                 so it only decides the very first boot.
# font_scale    multiplies every size in the type scale at once, 0.75..1.50.
#               1.0 is the design size; the ratios between a title, a menu row
#               and a count are fixed, so this moves the whole thing together.
volume=40
brightness=8
startup_system=NES
font_scale=1.0
