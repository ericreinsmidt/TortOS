# TortOS settings. This file is the whole settings screen -- there isn't one.
#
# volume and brightness are DEFAULTS, not settings. They apply to a device that
# has never had a level set on it; after that .userdata/<platform>/levels.cfg
# holds the level the player last chose, and that is what every boot restores.
#
# volume        0..100. 40 lands on 8 of the codec's 20 steps.
# brightness    0..11, and also what the boot animation is lit at. Twelve
#               geometric rungs shared with the emulator, so a level set in a
#               game and a level set here mean the same thing. 0 is the panel's
#               measured floor, not off.
# timezone       a zoneinfo name, as in America/New_York or Europe/Berlin.
#                The full database is on the device under
#                /usr/share/zoneinfo, so anything in there works.
#
#                This matters because every timestamp the launcher shows -
#                the date under a save slot - is local time, and the stock
#                firmware defaults to Asia/Shanghai. Left alone, a save made
#                at 3pm reads as 3am the next day.
#
#                The clock itself needs no setting: the firmware runs ntpd,
#                which corrects the time within a minute of Wi-Fi connecting.
#                Without Wi-Fi the device has no idea what day it is, and
#                nothing here can help with that.
timezone=America/New_York

# startup_system  which shelf to open on, by display name. The launcher
#                 overrides this with wherever you were when you last played,
#                 so it only decides the very first boot.
# font_scale    multiplies every size in the type scale at once. 1.0 is the
#               design size; the ratios between a title, a menu row and a
#               count are fixed, so this moves the whole thing together.
#               0.85, 1.0 or 1.15 - the three steps the Text Size row offers.
#               Anything outside that is clamped to it, because the panels are
#               laid out in fixed pixels and nothing wider was checked against
#               them.
volume=40
brightness=7
startup_system=NES
font_scale=1.0
