# Turbo, per system. Diatom's ADR-0028.
#
# `x:a~3,y:b~3` says X is a turbo A and Y is a turbo B, three frames pressed and
# three released - about ten presses a second at 60 Hz. TortOS sends this map to
# Diatom just after RUN, because RUN resets the map to identity and anything
# sent before it would be discarded by the launch it was meant for.
#
# Keyed on the same tag systems.cfg uses. A system with no line here plays with
# X and Y doing nothing, which is what they did on every system before this.
#
# Listed only where X and Y are SPARE. Nine of the eleven consoles have two face
# buttons, but a Genesis 6-button pad and a SNES pad use X and Y for real, so
# MD and SFC are absent on purpose rather than by oversight - turbo there would
# take away buttons games need.
#
# PCE is here on the same terms, despite the core having a turbo of its own: a
# hotkey on buttons III and IV that latches turbo for I and II. We do not use it.
# One interaction across seven systems beats two, and Diatom's works without the
# core's help. The PC Engine shipped a two-button pad and the core defaults to
# one (pce_fast_default_joypad_type_p1 = "2 Buttons"), so III to VI do not exist
# and X and Y go nowhere, exactly as on the rest of this list.
#
# The one thing that would break that: setting that core option to 6 Buttons
# turns X and Y into real buttons III and IV, and turbo would be taking them.
# It needs coreopts.cfg edited on the card, because nothing in the UI can reach
# a core option - and anyone in there can delete this line in the same sitting.
#
# The rate is the number to change if this feels wrong. Lower is faster; 1 is a
# press every other frame and almost certainly too fast for anything.

NES=x:a~3,y:b~3
SMS=x:a~3,y:b~3
PCE=x:a~3,y:b~3
GB=x:a~3,y:b~3
GBC=x:a~3,y:b~3
NGP=x:a~3,y:b~3
NGPC=x:a~3,y:b~3
GBA=x:a~3,y:b~3
GG=x:a~3,y:b~3
