# PlayOS systems. One per line, in the order they appear on the shelf.
#
#   sys | display name | Roms/ folder | core | tag | card art | accent | extensions
#
# tag is what minarch names saves, states and per-game configs after, so it is
# also the folder under Saves/. Three characters: struct Core declares tag[8]
# and a longer one is silently truncated.
#
# extensions is the allow-list for that folder. Without it a save file or a
# stray text file next to a ROM shows up on the shelf as a game.
#
# In release order: NES '85, Master System '86, Genesis '89, Game Boy '89,
# TurboGrafx-16 '89, Game Gear '91, SNES '91, Game Boy Color '98, GBA '01.
# Accents are sampled from each system's card art, then brightened to glow.
sys|NES|NES|fceumm|NES|NES.png|C4443A|nes,fds,unf,unif,zip
sys|Master System|Master System|genesis_plus_gx|SMS|SMS.png|E81D00|sms,zip
sys|Genesis|Genesis|genesis_plus_gx|MD|GENESIS.png|38A8E0|md,gen,bin,smd,zip
sys|Game Boy|Game Boy|mgba|GB|GB.png|78B478|gb,dmg,zip
sys|TurboGrafx-16|TurboGrafx-16|mednafen_pce_fast|PCE|PCE.png|E8641E|pce,sgx,cue,ccd,chd,toc,m3u,zip
sys|Game Gear|Game Gear|genesis_plus_gx|GG|GG.png|00E0A0|gg,zip
sys|SNES|SNES|snes9x2010|SFC|SNES.png|A8A0E0|sfc,smc,zip
sys|Game Boy Color|Game Boy Color|mgba|GBC|GBC.png|E0A870|gbc,cgb,zip
