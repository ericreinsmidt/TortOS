# TortOS systems. One per line, in the order they appear on the shelf.
#
#   sys | display name | Roms/ folder | core | tag | card art | accent | extensions | disc bios
#
# tag is what saves, states and per-game configs are named after, so it is also
# the folder under Saves/. Three characters: system_cfg declares tag[8] and a
# longer one is silently truncated. Changing a tag orphans that system's saves.
#
# display name and folder are separate fields and NGPC is the first row to use
# that: the shelf says Neo Geo Pocket Color and the card carries Roms/NGPC.
# The other nine happen to be identical, which is not a rule.
#
# extensions is the allow-list for that folder. Without it a save file or a
# stray text file next to a ROM shows up on the shelf as a game.
#
# disc bios is the firmware a DISC image on that shelf needs, looked for in
# Bios/. It is checked only for disc images: a PC Engine HuCard runs with no
# System Card, so declaring syscard3.pce for the whole shelf would refuse every
# cartridge on it. Empty for a system whose games need no firmware.
#
# In release order: NES '85, Master System '86, Genesis '89, Game Boy '89,
# TurboGrafx-16 '89, Game Gear '91, SNES '91, Game Boy Color '98,
# Neo Geo Pocket Color '99, GBA '01.

# Accents ARE each card's own rule color, sampled not adjusted. They were
# brightened for glow once; that made six of nine disagree with the card the
# player is looking at, which is the one place the color has to be right.
sys|NES|NES|fceumm|NES|NES.png|C4443A|nes,fds,unf,unif,zip
